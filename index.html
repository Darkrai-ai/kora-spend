<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kora - Expense Tracker</title>
    <meta name="description" content="Finance tracking with cloud sync.">
    <meta name="theme-color" content="#00C6FF">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kora">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#00C6FF',
                        secondary: '#0072FF'
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overscroll-behavior: none;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 5px;
            background: #d1d5db;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00C6FF, #0072FF);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 198, 255, 0.4);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00C6FF, #0072FF);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 198, 255, 0.4);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="module">
    // 1. Import Firebase modules (Added Redirect functions)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged }
        from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, onSnapshot, deleteDoc, writeBatch, getDocs }
        from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // 2. Make them available globally
    window.firebaseModules = {
        initializeApp,
        getAuth, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged,
        getFirestore, doc, setDoc, getDoc, collection, query, orderBy, onSnapshot, deleteDoc, writeBatch, getDocs
    };

    console.log("Firebase modules loaded (with Redirect support)");
</script>
<script type="text/babel">
    const { useState, useEffect, createContext, useContext } = React;

    // ============================================================================
    // FIREBASE CONFIGURATION
    // ============================================================================
    const FIREBASE_CONFIG = {
        apiKey: "AIzaSyDWQLPmEUAtlLLl7F5tWrwKkOlGpK7uxVU",
        authDomain: "kora-spend.firebaseapp.com",
        projectId: "kora-spend",
        storageBucket: "kora-spend.firebasestorage.app",
        messagingSenderId: "600528799162",
        appId: "1:600528799162:web:eeedf68fa9da5422390983",
        measurementId: "G-S56FHSLLKS"
    };

    // Set to true to enable Firebase features (Google Sign-In & Cloud Sync)
    const USE_FIREBASE = true;

    // ============================================================================
    // FIREBASE & DATA SETUP
    // ============================================================================
    let auth, db;

    // REPLACEMENT function for initFirebase
    const initFirebase = async () => {
        if (!USE_FIREBASE) return;

        // Check if modules loaded correctly from the script above
        if (!window.firebaseModules) {
            console.error("Firebase modules not loaded! Check internet connection or CDN URLs.");
            alert("Firebase failed to load. Using Guest Mode.");
            return;
        }

        try {
            // Get the tools from the window object we created
            const { initializeApp, getAuth, getFirestore } = window.firebaseModules;

            // Initialize App
            const app = initializeApp(FIREBASE_CONFIG);
            auth = getAuth(app);
            db = getFirestore(app);

            console.log("Firebase initialized successfully!");
        } catch (e) {
            console.error("Firebase Setup Error:", e);
            alert("Firebase Error: " + e.message);
        }
    };

    // Constants
    const CATEGORIES = ['food', 'transport', 'shopping', 'entertainment', 'bills', 'health', 'other'];
    const CURRENCIES = {
        usd: '$', eur: '€', gbp: '£', inr: '₹', jpy: '¥', cad: 'CA$', aud: 'A$',
        cny: '¥', chf: 'CHF', hkd: 'HK$', nzd: 'NZ$', sek: 'kr', krw: '₩', sgd: 'S$',
        nok: 'kr', mxn: 'MX$', rub: '₽', zar: 'R', try: '₺', brl: 'R$', twd: 'NT$',
        dkk: 'kr', pln: 'zł', thb: '฿', idr: 'Rp', huf: 'Ft', czk: 'Kč', ils: '₪',
        clp: 'CLP$', php: '₱', aed: 'د.إ', cop: 'COL$', sar: '﷼', myr: 'RM',
        ron: 'lei', vnd: '₫', ngn: '₦'
    };

    // Utility Functions
    const formatDate = (date) => {
        const d = new Date(date);
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        if (d.toDateString() === today.toDateString()) return 'Today';
        if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';

        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
    };

    const getGreeting = () => {
        const hour = new Date().getHours();
        if (hour < 12) return 'Good Morning';
        if (hour < 17) return 'Good Afternoon';
        return 'Good Evening';
    };
    // --- UPDATED ICON COMPONENT (Added 'calendar' icon) ---
    const Icon = ({ name, size = 24, color = "currentColor", className = "" }) => {
        const icons = {
            // Categories
            food: <path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3" />,
            transport: <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2M7 17h.01M17 17h.01M5 17h14" />,
            shopping: <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z M3 6h18 M16 10a4 4 0 0 1-8 0" />,
            entertainment: <path d="m22 8-6 4 6 4V8Z M2 6h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z" />,
            bills: <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8" />,
            health: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
            other: <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />,

            // UI Actions
            search: <path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.35-4.35" />,
            settings: <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" />,
            filter: <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" />,
            delete: <path d="M3 6h18 M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6 M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />,
            plus: <path d="M12 5v14 M5 12h14" />,
            arrowLeft: <path d="M19 12H5 M12 19l-7-7 7-7" />,
            chevronDown: <path d="M6 9l6 6 6-6" />,
            user: <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />,
            file: <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6" />,
            calendar: <path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z M16 2v4 M8 2v4 M3 10h18" />
        };

        return (
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width={size}
                height={size}
                viewBox="0 0 24 24"
                fill="none"
                stroke={color}
                strokeWidth="2"
                strokeLinecap="round"
                strokeLinejoin="round"
                className={className}
            >
                {icons[name] || icons.other}
            </svg>
        );
    };

    // REPLACE your old getCategoryIcon function with this:
    const getCategoryIcon = (category) => {
        // We map your categories to the minimalist icon names
        const map = {
            food: 'food', transport: 'transport', shopping: 'shopping',
            entertainment: 'entertainment', bills: 'bills', health: 'health',
            other: 'other'
        };
        return <Icon name={map[category] || 'other'} size={24} className="text-gray-700 dark:text-gray-200" />;
    };

    // Local Storage Service
    const LocalService = {
        saveProfile: (profile) => localStorage.setItem('kora_profile', JSON.stringify(profile)),
        getProfile: () => {
            const data = localStorage.getItem('kora_profile');
            return data ? JSON.parse(data) : null;
        },
        saveExpenses: (expenses) => localStorage.setItem('kora_expenses', JSON.stringify(expenses)),
        getExpenses: () => {
            const data = localStorage.getItem('kora_expenses');
            return data ? JSON.parse(data) : [];
        },
        clearAll: () => {
            localStorage.removeItem('kora_profile');
            localStorage.removeItem('kora_expenses');
        },
        hasData: () => localStorage.getItem('kora_expenses') || localStorage.getItem('kora_profile')
    };

    // Currency API
    const getCurrencyRate = async (from, to) => {
        try {
            const response = await fetch(`https://api.exchangerate-api.com/v4/latest/${from.toUpperCase()}`);
            const data = await response.json();
            return data.rates[to.toUpperCase()];
        } catch (e) {
            console.error("Currency API error:", e);
            return null;
        }
    };

    // ============================================================================
    // CONTEXT
    // ============================================================================
    const AppContext = createContext();

    // ============================================================================
    // MAIN APP
    // ============================================================================

    const App = () => {
        const [loading, setLoading] = useState(true);
        const [user, setUser] = useState(null);
        const [isGuest, setIsGuest] = useState(false);
        const [hasOnboarded, setHasOnboarded] = useState(false);
        const [profile, setProfile] = useState({
            name: 'User',
            currency: 'usd',
            isDarkMode: true
        });
        const [expenses, setExpenses] = useState([]);
        const [currentScreen, setCurrentScreen] = useState('login');

        useEffect(() => {
            const init = async () => {
                await initFirebase();


                if (!USE_FIREBASE || !auth) {
                    const localProfile = LocalService.getProfile();
                    if (localProfile) {
                        setProfile(localProfile);
                        setIsGuest(true);
                        setHasOnboarded(true);
                        setExpenses(LocalService.getExpenses());
                        setCurrentScreen('dashboard');
                    }
                    setLoading(false);
                    return;
                }

                const { onAuthStateChanged } = window.firebaseModules;
                const unsubscribe = onAuthStateChanged(auth, async (firebaseUser) => {
                    if (firebaseUser) {
                        setUser(firebaseUser);
                        await loadCloudData(firebaseUser);
                    } else {
                        const localProfile = LocalService.getProfile();
                        if (localProfile) {
                            setProfile(localProfile);
                            setIsGuest(true);
                            setHasOnboarded(true);
                            setExpenses(LocalService.getExpenses());
                            setCurrentScreen('dashboard');
                        }
                        setLoading(false);
                    }
                });

                return () => unsubscribe();
            };

            init();
        }, []);

        const loadCloudData = async (firebaseUser) => {
            try {
                const { doc, getDoc, collection, query, orderBy, onSnapshot } = window.firebaseModules;
                const userDoc = await getDoc(doc(db, 'users', firebaseUser.uid));

                if (userDoc.exists()) {
                    setProfile({ ...userDoc.data(), isDarkMode: userDoc.data().isDarkMode ?? true });
                    setHasOnboarded(true);
                    setCurrentScreen('dashboard');

                    const expensesRef = collection(db, 'users', firebaseUser.uid, 'expenses');
                    const q = query(expensesRef, orderBy('date', 'desc'));
                    onSnapshot(q, (snapshot) => {
                        const expensesList = snapshot.docs.map(doc => ({
                            ...doc.data(),
                            date: doc.data().date?.toDate?.() || new Date(doc.data().date)
                        }));
                        setExpenses(expensesList);
                    });
                } else {
                    setProfile({ name: firebaseUser.displayName || 'User', currency: 'usd', isDarkMode: true });
                    setHasOnboarded(false);
                    setCurrentScreen('onboarding');
                }
            } catch (e) {
                console.error("Error loading cloud data:", e);
            }
            setLoading(false);
        };

        const loginAsGuest = () => {
            const guestProfile = { name: 'Guest', currency: 'usd', isDarkMode: true };
            LocalService.saveProfile(guestProfile);
            setProfile(guestProfile);
            setIsGuest(true);
            setHasOnboarded(false);
            setCurrentScreen('onboarding');
        };

        const loginWithGoogle = async () => {
            if (!USE_FIREBASE || !auth) {
                alert("Firebase not configured. Using guest mode.");
                loginAsGuest();
                return;
            }

            try {
                // REVERTED: Use Popup (Works best on iOS now that Domain is fixed)
                const { signInWithPopup, GoogleAuthProvider } = window.firebaseModules;
                const provider = new GoogleAuthProvider();

                // This will open a Safari modal overlay
                await signInWithPopup(auth, provider);

                // No need to handle redirect result anymore,
                // the code below will just run automatically after popup closes
            } catch (e) {
                console.error("Login error:", e);
                alert("Login failed: " + e.message);
            }
        };

        const mergeData = async (firebaseUser) => {
            const { writeBatch, doc } = window.firebaseModules;
            const localExpenses = LocalService.getExpenses();
            const batch = writeBatch(db);

            localExpenses.forEach(exp => {
                const expRef = doc(db, 'users', firebaseUser.uid, 'expenses', exp.id);
                batch.set(expRef, { ...exp, date: new Date(exp.date) });
            });

            await batch.commit();
            LocalService.clearAll();
            await loadCloudData(firebaseUser);
        };

        const completeOnboarding = async (name, currency) => {
            const updatedProfile = { ...profile, name, currency };

            if (isGuest) {
                LocalService.saveProfile(updatedProfile);
            } else if (user) {
                const { setDoc, doc } = window.firebaseModules;
                await setDoc(doc(db, 'users', user.uid), updatedProfile, { merge: true });
            }

            setProfile(updatedProfile);
            setHasOnboarded(true);
            setCurrentScreen('dashboard');
        };

        const updateProfile = async (updates) => {
            const updatedProfile = { ...profile, ...updates };

            if (isGuest) {
                LocalService.saveProfile(updatedProfile);
            } else if (user) {
                const { setDoc, doc } = window.firebaseModules;
                await setDoc(doc(db, 'users', user.uid), updatedProfile, { merge: true });
            }

            setProfile(updatedProfile);
        };

        const addOrUpdateExpense = async (expense) => {
            if (isGuest) {
                const current = LocalService.getExpenses();
                const index = current.findIndex(e => e.id === expense.id);

                if (index !== -1) {
                    current[index] = expense;
                } else {
                    current.push(expense);
                }

                LocalService.saveExpenses(current);
                setExpenses([...current].sort((a, b) => new Date(b.date) - new Date(a.date)));
            } else if (user) {
                const { setDoc, doc } = window.firebaseModules;
                await setDoc(doc(db, 'users', user.uid, 'expenses', expense.id), {
                    ...expense,
                    date: new Date(expense.date)
                });
            }
        };

        const deleteExpense = async (id) => {
            if (isGuest) {
                const current = LocalService.getExpenses().filter(e => e.id !== id);
                LocalService.saveExpenses(current);
                setExpenses(current);
            } else if (user) {
                const { deleteDoc, doc } = window.firebaseModules;
                await deleteDoc(doc(db, 'users', user.uid, 'expenses', id));
            }
        };

        const convertCurrency = async (newCurrency) => {
            if (newCurrency === profile.currency) return;

            const rate = await getCurrencyRate(profile.currency, newCurrency);
            if (!rate) {
                alert("Cannot convert currency (Offline or API error)");
                return;
            }

            if (isGuest) {
                const converted = expenses.map(e => ({ ...e, amount: e.amount * rate }));
                LocalService.saveExpenses(converted);
                setExpenses(converted);
            } else if (user) {
                const { collection, getDocs, writeBatch } = window.firebaseModules;
                const expensesRef = collection(db, 'users', user.uid, 'expenses');
                const snapshot = await getDocs(expensesRef);
                const batch = writeBatch(db);

                snapshot.docs.forEach(doc => {
                    batch.update(doc.ref, { amount: doc.data().amount * rate });
                });

                await batch.commit();
            }

            await updateProfile({ currency: newCurrency });
            alert(`Converted to ${newCurrency.toUpperCase()} (Rate: ${rate.toFixed(4)})`);
        };

        const logout = async () => {
            if (!isGuest && auth) {
                const { signOut } = window.firebaseModules;
                await signOut(auth);
            }

            LocalService.clearAll();
            setUser(null);
            setIsGuest(false);
            setHasOnboarded(false);
            setProfile({ name: 'User', currency: 'usd', isDarkMode: true });
            setExpenses([]);
            setCurrentScreen('login');
        };

        const contextValue = {
            user, isGuest, profile, expenses, hasOnboarded,
            loginAsGuest, loginWithGoogle, completeOnboarding, updateProfile,
            addOrUpdateExpense, deleteExpense, convertCurrency, logout, setCurrentScreen
        };

        if (loading) {
            return (
                <div className="min-h-screen bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900 flex items-center justify-center">
                    <div className="w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
                </div>
            );
        }

        return (
            <AppContext.Provider value={contextValue}>
                <div className={profile.isDarkMode ? 'dark' : ''}>
                    <div className="min-h-screen bg-gray-50 dark:bg-gray-950 transition-colors">
                        {currentScreen === 'login' && <LoginScreen />}
                        {currentScreen === 'onboarding' && <OnboardingScreen />}
                        {currentScreen === 'dashboard' && <DashboardScreen />}
                        {currentScreen === 'settings' && <SettingsScreen />}
                    </div>
                </div>
            </AppContext.Provider>
        );
    };

    // ============================================================================
    // LOGIN SCREEN
    // ============================================================================
    const LoginScreen = () => {
        const { loginAsGuest, loginWithGoogle } = useContext(AppContext);
        const [loading, setLoading] = useState(false);

        const handleGoogleLogin = async () => {
            setLoading(true);
            await loginWithGoogle();
            setLoading(false);
        };

        return (
            <div className="min-h-screen bg-gradient-to-br from-gray-900 via-blue-900 to-gray-800 flex items-center justify-center p-4">
                <div className="text-center max-w-md w-full animate-fadeIn">
                    <div className="mb-8">
                        <img src="logo.png" alt="Kora Logo" className="w-32 h-32 mx-auto mb-6 object-contain rounded-3xl" />
                        <h1 className="text-5xl font-bold text-white mb-2 tracking-wider">Kora</h1>
                        <p className="text-gray-300">Spend. Add. Repeat.</p>
                    </div>

                    {loading ? (
                        <div className="w-16 h-16 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    ) : (
                        <div className="space-y-4">
                            <button
                                onClick={handleGoogleLogin}
                                className="w-full bg-white text-gray-800 py-4 rounded-full font-semibold shadow-lg hover:shadow-xl transform hover:scale-105 transition-all flex items-center justify-center gap-3"
                            >
                                <span className="text-2xl font-bold text-blue-500">G</span>
                                Sign in with Google
                            </button>
                            <button
                                onClick={loginAsGuest}
                                className="w-full bg-transparent border-2 border-white/30 text-white py-4 rounded-full font-semibold hover:bg-white/10 transition-all"
                            >
                                Continue as Guest (Local)
                            </button>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    // ============================================================================
    // ONBOARDING SCREEN
    // ============================================================================
    const OnboardingScreen = () => {
        const { profile, completeOnboarding } = useContext(AppContext);
        const [name, setName] = useState(profile.name);
        const [currency, setCurrency] = useState(profile.currency);

        const handleSubmit = () => {
            if (name.trim()) {

    // ============================================================================
    // DASHBOARD SCREEN
    // ============================================================================
    const DashboardScreen = () => {
        const { profile, expenses, isGuest, addOrUpdateExpense, deleteExpense, convertCurrency, setCurrentScreen } = useContext(AppContext);
        const [searchQuery, setSearchQuery] = useState('');
        const [view, setView] = useState('month'); // 'month', 'today', 'total'
        const [selectedDate, setSelectedDate] = useState(new Date()); // Controls the date shown in blue box

        const [showAddModal, setShowAddModal] = useState(false);
        const [showFilterModal, setShowFilterModal] = useState(false);
        const [showCurrencyModal, setShowCurrencyModal] = useState(false);
        const [editingExpense, setEditingExpense] = useState(null);
        const [priceFilter, setPriceFilter] = useState([0, Number.MAX_SAFE_INTEGER]); 
        const [dateRange, setDateRange] = useState([null, null]);
        // Filter list based on Search, Price, and generic Date Range filter
        const filteredExpenses = expenses.filter(e => {
            const matchesSearch = e.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                e.description?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                e.category.toLowerCase().includes(searchQuery.toLowerCase());
            const matchesPrice = e.amount >= priceFilter[0] && e.amount <= priceFilter[1];
            let matchesDate = true;

            if (dateRange[0] && dateRange[1]) {
                const expDate = new Date(e.date);
                matchesDate = expDate >= dateRange[0] && expDate <= dateRange[1];
            }

            return matchesSearch && matchesPrice && matchesDate;
        });

        // Group expenses for the list view below the card
        const groupedExpenses = filteredExpenses.reduce((acc, exp) => {
            const dateKey = formatDate(exp.date);
            if (!acc[dateKey]) acc[dateKey] = [];
            acc[dateKey].push(exp);
            return acc;
        }, {});

        // Calculate total based on VIEW + SELECTED DATE
        const calculateTotal = () => {
            if (view === 'total') return filteredExpenses.reduce((sum, e) => sum + e.amount, 0);

            return filteredExpenses.filter(e => {
                const d = new Date(e.date);

                if (view === 'month') {
                    // Compare Month and Year
                    return d.getMonth() === selectedDate.getMonth() &&
                        d.getFullYear() === selectedDate.getFullYear();
                }

                if (view === 'today') {
                    // Compare exact Date
                    return d.toDateString() === selectedDate.toDateString();
                }

                return false;
            }).reduce((sum, e) => sum + e.amount, 0);
        };

        const currencySymbol = CURRENCIES[profile.currency];
        const total = calculateTotal();

        // Helper to format the label shown at top left of blue card
        const getDateLabel = () => {
            if (view === 'total') return 'Total Spent';

            const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            if (view === 'month') {
                return `${months[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;
            }
            if (view === 'today') {
                // Check if it's actually today to say "Today", otherwise show date
                if(selectedDate.toDateString() === new Date().toDateString()) return 'Today';
                return selectedDate.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
            }
        };

        return (
            <div className="min-h-screen bg-gray-50 dark:bg-gray-950 pb-24">
                {/* Header */}
                <div className="bg-white dark:bg-gray-900 px-6 pt-6 pb-4">
                    <div className="flex justify-between items-start mb-6">
                        <div className="flex-1">
                            <div className="flex items-center gap-3 mb-4">
                                <img src="logo.png" alt="Logo" className="w-10 h-10 object-contain rounded-lg" />
                                <h1 className="text-xl font-bold text-gray-900 dark:text-white tracking-wider">Kora</h1>
                            </div>
                            <p className="text-sm text-gray-600 dark:text-gray-400">{getGreeting()},</p>
                            <h2 className="text-3xl font-bold text-gray-900 dark:text-white mb-1">{profile.name}</h2>
                            {isGuest && (
                                <span className="inline-block bg-purple-600 text-white text-xs font-bold px-2 py-1 rounded">LOCAL GUEST</span>
                            )}
                        </div>
                        <button
                            onClick={() => setCurrentScreen('settings')}
                            className="p-2 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors"
                        >
                            <Icon name="settings" size={24} className="text-gray-900 dark:text-white" />
                        </button>
                    </div>

                    {/* Spending Card (Blue Box) */}
                    <div className="bg-gradient-to-br from-cyan-400 to-blue-600 rounded-3xl p-6 shadow-2xl">
                        <div className="flex justify-between items-center mb-4">
                            <p className="text-white/80 text-sm font-semibold tracking-wide">
                                {getDateLabel()}
                            </p>
                            <div className="flex gap-1 bg-black/20 rounded-full p-1">
                                {['month', 'today', 'total'].map(v => (
                                    <button
                                        key={v}
                                        onClick={() => {
                                            setView(v);
                                            // Reset date to today when switching views for better UX
                                            if(v !== view) setSelectedDate(new Date());
                                        }}
                                        className={`px-3 py-1 rounded-full text-xs font-semibold transition-all ${
                                            view === v ? 'bg-white/20 text-white' : 'text-white/60'
                                        }`}
                                    >
                                        {v === 'month' ? 'Month' : v === 'today' ? 'Day' : 'All'}
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div className="flex justify-between items-end">
                            <h3 className="text-4xl font-bold text-white">{currencySymbol}{total.toFixed(2)}</h3>

                            <div className="flex gap-2">
                                {/* DATE SELECTOR BUTTON (Only shows if not in 'All' view) */}
                                {view !== 'total' && (
                                    <div className="relative bg-white/20 border border-white/30 rounded-xl hover:bg-white/30 transition-colors">
                                        {/* Invisible Input Layer */}
                                        <input
                                            type={view === 'month' ? 'month' : 'date'}
                                            className="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10"
                                            onChange={(e) => {
                                                if(e.target.value) {
                                                    // input type="month" returns "2023-10", date returns "2023-10-25"
                                                    // We append '-01' for month type to make it parseable
                                                    const val = view === 'month' ? e.target.value + '-01' : e.target.value;
                                                    setSelectedDate(new Date(val));
                                                }
                                            }}
                                        />
                                        {/* Visible Button Layer */}
                                        <button className="px-3 py-2 text-white h-full flex items-center justify-center">
                                            <Icon name="calendar" size={16} />
                                        </button>
                                    </div>
                                )}

                                {/* CURRENCY BUTTON */}
                                <button
                                    onClick={() => setShowCurrencyModal(true)}
                                    className="bg-white/20 border border-white/30 px-3 py-2 rounded-xl text-white text-xs font-bold flex items-center gap-1 hover:bg-white/30 transition-colors"
                                >
                                    {profile.currency.toUpperCase()} <Icon name="chevronDown" size={16} />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                {/* Search Bar */}
                <div className="px-6 py-4 flex gap-3">
                    <div className="flex-1 bg-white dark:bg-gray-900 rounded-2xl px-4 py-3 flex items-center gap-2 shadow-sm">
                        <Icon name="search" size={20} className="text-gray-400" />
                        <input
                            type="text"
                            placeholder="Search expenses..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="flex-1 bg-transparent outline-none text-gray-900 dark:text-white"
                        />
                    </div>
                    <button
                        onClick={() => setShowFilterModal(true)}
                        className={`p-3 rounded-2xl shadow-sm transition-colors ${
                            priceFilter[1] < 100000 || dateRange[0]
                                ? 'bg-cyan-400/20 border-2 border-cyan-400'
                                : 'bg-white dark:bg-gray-900'
                        }`}
                    >
                        <Icon name="filter" size={24} className={priceFilter[1] < 100000 || dateRange[0] ? 'text-cyan-400' : 'text-gray-500'} />
                    </button>
                </div>

                {/* Expenses List */}
                <div className="px-6">
                    {Object.keys(groupedExpenses).length === 0 ? (
                        <div className="text-center py-20">
                            <div className="flex justify-center mb-4">
                                <Icon name="file" size={64} className="text-gray-300 dark:text-gray-700" />
                            </div>
                            <p className="text-gray-500">No expenses found</p>
                        </div>
                    ) : (
                        Object.entries(groupedExpenses).map(([date, exps]) => (
                            <div key={date} className="mb-6 animate-fadeIn">
                                <div className="flex justify-between items-center px-2 mb-3">
                                    <h4 className="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">{date}</h4>
                                    <p className="text-xs text-gray-500">{currencySymbol}{exps.reduce((sum, e) => sum + e.amount, 0).toFixed(2)}</p>
                                </div>
                                <div className="space-y-2">
                                    {exps.map(exp => (
                                        <div
                                            key={exp.id}
                                            onClick={() => { setEditingExpense(exp); setShowAddModal(true); }}
                                            className="bg-white dark:bg-gray-900 rounded-2xl p-4 flex items-center gap-4 shadow-sm cursor-pointer hover:shadow-md transition-shadow"
                                        >
                                            <div className="w-12 h-12 bg-gray-100 dark:bg-gray-800 rounded-2xl flex items-center justify-center">
                                                {getCategoryIcon(exp.category)}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h5 className="font-bold text-gray-900 dark:text-white truncate">{exp.title}</h5>
                                                {exp.description && (
                                                    <p className="text-sm text-gray-500 truncate">{exp.description}</p>
                                                )}
                                            </div>
                                            <p className="font-semibold text-gray-900 dark:text-white">-{currencySymbol}{exp.amount.toFixed(2)}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))
                    )}
                </div>

                {/* FAB */}
                <button
                    onClick={() => { setEditingExpense(null); setShowAddModal(true); }}
                    className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gradient-to-r from-cyan-400 to-blue-600 text-white px-8 py-4 rounded-full font-bold shadow-2xl hover:shadow-cyan-400/50 flex items-center gap-2 transform hover:scale-105 transition-all z-40"
                >
                    <Icon name="plus" size={24} /> Add Expense
                </button>

                {/* Modals */}
                {showAddModal && (
                    <AddExpenseModal
                        expense={editingExpense}
                        onSave={(exp) => { addOrUpdateExpense(exp); setShowAddModal(false); }}
                        onDelete={(id) => { deleteExpense(id); setShowAddModal(false); }}
                        onClose={() => setShowAddModal(false)}
                        currency={profile.currency}
                    />
                )}
                {showFilterModal && (
                    <FilterModal
                        priceFilter={priceFilter}
                        dateRange={dateRange}
                        onApply={(price, dates) => { setPriceFilter(price); setDateRange(dates); setShowFilterModal(false); }}
                        onClose={() => setShowFilterModal(false)}
                        currency={profile.currency}
                    />
                )}
                {showCurrencyModal && (
                    <CurrencyModal
                        current={profile.currency}
                        onSelect={async (curr) => { await convertCurrency(curr); setShowCurrencyModal(false); }}
                        onClose={() => setShowCurrencyModal(false)}
                    />
                )}
            </div>
        );
    };

    // ============================================================================
    // ADD EXPENSE MODAL
    // ============================================================================
    const AddExpenseModal = ({ expense, onSave, onDelete, onClose, currency }) => {
        const [title, setTitle] = useState(expense?.title || '');
        const [amount, setAmount] = useState(expense?.amount?.toString() || '');
        const [description, setDescription] = useState(expense?.description || '');
        const [category, setCategory] = useState(expense?.category || 'other');
        const [date, setDate] = useState(expense?.date ? new Date(expense.date).toISOString().split('T')[0] : new Date().toISOString().split('T')[0]);

        const handleSubmit = () => {
            if (!title.trim() || !amount) return;
            const exp = {
                id: expense?.id || Date.now().toString(),
                title: title.trim(),
                amount: parseFloat(amount),
                description: description.trim(),
                category,
                date: new Date(date)
            };
            onSave(exp);
        };

        return (
            <div className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50 p-4" onClick={onClose}>
                <div
                    className="bg-white dark:bg-gray-900 rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto animate-fadeIn"

                        <div className="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-6"></div>

                        </div>

                        <div className="space-y-4">
                            <div className="relative">
                                <span className="absolute left-0 top-0 text-4xl font-bold text-cyan-400">{CURRENCIES[currency]}</span>
                                <input
                                    type="number"
                                    step="0.01"
                                    value={amount}
                                    onChange={(e) => setAmount(e.target.value)}
                                    placeholder="0.00"
                                    className="w-full text-4xl font-bold bg-transparent text-gray-900 dark:text-white outline-none pl-12"
                                />
                            </div>
                            <input
                                type="text"
                                value={title}
                                onChange={(e) => setTitle(e.target.value)}
                                placeholder="Title"
                                className="w-full bg-gray-100 dark:bg-gray-800 rounded-2xl px-4 py-3 text-gray-900 dark:text-white outline-none"
                            />
                            <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                {CATEGORIES.map(cat => (
                                    <button
                                        key={cat}
                                        onClick={() => setCategory(cat)}

                                            category === cat
                                                ? 'bg-cyan-400 text-white'
                                                : 'bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-300'
                                        }`}
                                    >
                                        {cat.charAt(0).toUpperCase() + cat.slice(1)}
                                    </button>
                                ))}
                            </div>
                            <input
                                type="date"
                                value={date}
                                onChange={(e) => setDate(e.target.value)}
                                className="w-full bg-gray-100 dark:bg-gray-800 rounded-2xl px-4 py-3 text-gray-900 dark:text-white outline-none"
                            />
                            <textarea
                                value={description}
                                onChange={(e) => setDescription(e.target.value)}

                        >
                            Save Expense
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // ============================================================================
    // FILTER MODAL
    // ============================================================================
        // ============================================================================
    // FILTER MODAL (UPDATED)
    // ============================================================================
    const FilterModal = ({ priceFilter, dateRange, onApply, onClose, currency }) => {
        // Use 100000 as the visual "max" for the slider, but logic handles Infinity
        const SLIDER_MAX = 100000;
        
        const [price, setPrice] = useState([
            priceFilter[0], 
            priceFilter[1] >= Number.MAX_SAFE_INTEGER ? SLIDER_MAX : priceFilter[1]
        ]);
        const [dates, setDates] = useState(dateRange);

        const handleApply = () => {
            // If slider is at max, set actual limit to Infinity
            const finalMax = price[1] >= SLIDER_MAX ? Number.MAX_SAFE_INTEGER : price[1];
            onApply([price[0], finalMax], dates);
        };

        return (
            <div className="fixed inset-0 bg-black/50 flex items-end sm:items-center justify-center z-50 p-4" onClick={onClose}>
                <div
                    className="bg-white dark:bg-gray-900 rounded-t-3xl sm:rounded-3xl w-full max-w-lg p-6 animate-fadeIn"
                    onClick={(e) => e.stopPropagation()}
                >
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="text-2xl font-bold text-gray-900 dark:text-white">Filter Results</h3>
                        <button 
                            onClick={() => { setPrice([0, SLIDER_MAX]); setDates([null, null]); }} 
                            className="text-red-500 font-semibold"
                        >
                            Reset
                        </button>
                    </div>

                    <div className="space-y-6">
                        <div>
                            <label className="block text-sm font-semibold text-gray-600 dark:text-gray-400 mb-2">Date Range</label>
                            <div className="flex gap-2">
                                <input
                                    type="date"
                                    value={dates[0]?.toISOString().split('T')[0] || ''}
                                    onChange={(e) => setDates([new Date(e.target.value), dates[1]])}
                                    className="flex-1 bg-gray-100 dark:bg-gray-800 rounded-xl px-4 py-3 text-gray-900 dark:text-white outline-none"
                                />
                                <input
                                    type="date"
                                    value={dates[1]?.toISOString().split('T')[0] || ''}
                                    onChange={(e) => setDates([dates[0], new Date(e.target.value)])}
                                    className="flex-1 bg-gray-100 dark:bg-gray-800 rounded-xl px-4 py-3 text-gray-900 dark:text-white outline-none"
                                />
                            </div>
                        </div>

                        <div>
                            <div className="flex justify-between mb-2">
                                <label className="text-sm font-semibold text-gray-600 dark:text-gray-400">Price Range</label>
                                <span className="text-sm text-gray-900 dark:text-white font-mono">
                                    {CURRENCIES[currency]}{price[0]} - {price[1] >= SLIDER_MAX ? 'Unlimited' : CURRENCIES[currency] + price[1]}
                                </span>
                            </div>
                            <input
                                type="range"
                                min="0"
                                max={SLIDER_MAX}
                                step="100"
                                value={price[1]}
                                onChange={(e) => setPrice([price[0], parseInt(e.target.value)])}
                                className="w-full"
                            />
                            <div className="flex justify-between text-xs text-gray-400 mt-1">
                                <span>0</span>
                                <span>100k+</span>
                            </div>
                        </div>
                    </div>

                    <button
                        onClick={handleApply}
                        className="w-full mt-6 bg-gradient-to-r from-cyan-400 to-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg"
                    >
                        Apply Filters
                    </button>
                </div>
            </div>
        );
    };

                        </div>

                        <div>
                            <label className="block text-cyan-400 font-semibold mb-2">Preferences</label>
                            <div className="bg-white dark:bg-gray-900 rounded-xl p-4 space-y-4 border-2 border-gray-200 dark:border-gray-800">
                                <div className="flex justify-between items-center">
                                    <span className="text-gray-900 dark:text-white">Currency</span>
                                    <select
                                        value={currency}
                                        onChange={(e) => setCurrency(e.target.value)}
                                        className="bg-gray-100 dark:bg-gray-800 text-gray-900 dark:text-white px-3 py-2 rounded-lg outline-none"
                                    >
                                        {Object.keys(CURRENCIES).map(curr => (
                                            <option key={curr} value={curr}>{curr.toUpperCase()}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label className="block text-cyan-400 font-semibold mb-2">Appearance</label>
                            <div className="bg-white dark:bg-gray-900 rounded-xl p-4 border-2 border-gray-200 dark:border-gray-800">
                                <div className="flex justify-between items-center">
                                    <span className="text-gray-900 dark:text-white">Dark Mode</span>
                                    <button
                                        onClick={() => updateProfile({ isDarkMode: !profile.isDarkMode })}
                                        className={`w-14 h-8 rounded-full transition-colors relative ${
                                            profile.isDarkMode ? 'bg-cyan-400' : 'bg-gray-300'
                                        }`}
                                    >
                                        <div className={`w-6 h-6 bg-white rounded-full absolute top-1 transition-transform ${
                                            profile.isDarkMode ? 'translate-x-7' : 'translate-x-1'
                                        }`}></div>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button
                            onClick={saveSettings}
                            className="w-full bg-gradient-to-r from-cyan-400 to-blue-600 text-white py-4 rounded-2xl font-bold transform hover:scale-105 transition-all"
                        >
                            Save Settings
                        </button>

                        <button
                            onClick={logout}
                            className="w-full bg-red-500 text-white py-4 rounded-2xl font-bold transform hover:scale-105 transition-all"
                        >
                            Log Out
                        </button>

                        <p className="text-center text-gray-500 text-sm italic mt-8">
                            Made by SaphireScaperescape (Utsaphire)
                        </p>
                    </div>
                </div>
            </div>
        );
    };

    // ============================================================================
    // RENDER APP
    // ============================================================================
    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
